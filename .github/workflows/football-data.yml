
name: Aktualizace fotbalových zapasu

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Načíst skutečné zápasy
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, datetime, urllib.request
          from pathlib import Path

          today = datetime.date.today()
          end = today + datetime.timedelta(days=7)
          url = (
              "https://api.football-data.org/v4/matches"
              f"?dateFrom={today.isoformat()}&dateTo={end.isoformat()}"
          )
          request = urllib.request.Request(
              url,
              headers={"X-Auth-Token": os.environ["FOOTBALL_DATA_TOKEN"]}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          Path("data").mkdir(exist_ok=True)
          result = {
              "updated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "matches": data.get("matches", [])
          }
          Path("data/matches.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print("Načteno zápasů:", len(result["matches"]))
          PY

      - name: Uložit aktualizovaná data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git diff --cached --quiet || git commit -m "Aktualizace fotbalových zápasů"
          git push
