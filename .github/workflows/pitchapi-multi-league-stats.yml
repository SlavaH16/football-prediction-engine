name: Collect PitchAPI statistics for multiple leagues

"on":
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: pitchapi-multi-league-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PitchAPI client
        run: python -m pip install --upgrade pip pitchapi

      - name: Collect a small batch of match statistics
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python -u - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from pitchapi import PitchAPI

          API_KEY = os.environ.get("PITCHAPI_API_KEY")
          if not API_KEY:
              raise SystemExit("Missing GitHub secret PITCHAPI_API_KEY")

          LEAGUES = {
              "Premier League": "l_4WFCIZ",
              "Czech First League": "l_0F4I4F",
              "Bundesliga": "l_1Isor4",
              "LaLiga": "l_0ErfuF",
              "Serie A": "l_0ALvwF",
              "Ligue 1": "l_3FJFUl",
          }
          MAX_NEW_MATCHES = 8
          OUTPUT = Path("data/pitchapi_stats.json")
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          if OUTPUT.exists():
              store = json.loads(OUTPUT.read_text(encoding="utf-8"))
              if not isinstance(store, dict):
                  raise SystemExit("Unexpected data format in data/pitchapi_stats.json")
          else:
              store = {}
          store.setdefault("matches", {})
          store.setdefault("metadata", {})
          if not isinstance(store["matches"], dict):
              raise SystemExit("Unexpected 'matches' format; no data was changed.")

          def as_dict(obj):
              if hasattr(obj, "model_dump"):
                  return obj.model_dump()
              if isinstance(obj, dict):
                  return {k: as_dict(v) for k, v in obj.items()}
              if isinstance(obj, list):
                  return [as_dict(v) for v in obj]
              if hasattr(obj, "__dict__"):
                  return {k: as_dict(v) for k, v in vars(obj).items() if not k.startswith("_")}
              if isinstance(obj, (str, int, float, bool)) or obj is None:
                  return obj
              return str(obj)

          def get_list(result, *keys):
              result = as_dict(result)
              if isinstance(result, list):
                  return result
              if isinstance(result, dict):
                  for key in keys:
                      if isinstance(result.get(key), list):
                          return result[key]
              return []

          def method_at(obj, *path):
              for part in path:
                  obj = getattr(obj, part)
              return obj

          def invoke(method, **kwargs):
              try:
                  return method(**kwargs)
              except TypeError:
                  if "league_id" in kwargs and "season" in kwargs:
                      return method(kwargs["league_id"], kwargs["season"])
                  if "match_id" in kwargs:
                      return method(kwargs["match_id"])
                  raise

          def save_now():
              store["metadata"].update({
                  "source": "PitchAPI",
                  "leagues": LEAGUES,
                  "last_checkpoint_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "total_stored_matches": len(store["matches"]),
              })
              temp = OUTPUT.with_suffix(".json.tmp")
              temp.write_text(json.dumps(store, ensure_ascii=False, indent=2, default=str) + "\n", encoding="utf-8")
              temp.replace(OUTPUT)

          errors = []
          discovered = 0
          collected = 0

          with PitchAPI(api_key=API_KEY) as client:
              catalogue = get_list(method_at(client, "leagues", "list")(), "leagues", "data")
              catalogue_by_id = {}
              for item in catalogue:
                  item = as_dict(item)
                  if isinstance(item, dict) and item.get("id"):
                      catalogue_by_id[item["id"]] = item

              matches_method = method_at(client, "matches", "list")
              stats_method = method_at(client, "matches", "stats")
              shots_method = method_at(client, "matches", "shots")
              advanced_method = method_at(client, "matches", "advanced")

              stop = False
              for league_name, league_id in LEAGUES.items():
                  seasons = catalogue_by_id.get(league_id, {}).get("seasons", [])
                  if not seasons:
                      msg = f"{league_name}: no seasons found in catalogue"
                      errors.append(msg)
                      print("WARNING:", msg, flush=True)
                      continue

                  for season in seasons:
                      if collected >= MAX_NEW_MATCHES:
                          stop = True
                          break
                      print(f"Checking {league_name}, season {season}; saved {collected}/{MAX_NEW_MATCHES}", flush=True)
                      try:
                          raw = invoke(matches_method, league_id=league_id, season=season)
                          matches = get_list(raw, "matches", "data", "events")
                          discovered += len(matches)
                          print(f"  Matches returned by API: {len(matches)}", flush=True)

                          for raw_match in matches:
                              if collected >= MAX_NEW_MATCHES:
                                  stop = True
                                  break
                              match = as_dict(raw_match)
                              if not isinstance(match, dict):
                                  continue
                              match_id = match.get("id") or match.get("match_id")
                              if match_id is None:
                                  continue
                              key = str(match_id)
                              if key in store["matches"]:
                                  continue

                              status_obj = match.get("status") or match.get("state") or match.get("match_status") or ""
                              if isinstance(status_obj, dict):
                                  status_obj = status_obj.get("name") or status_obj.get("description") or str(status_obj)
                              status = str(status_obj).casefold()
                              finished = (
                                  match.get("is_finished") is True
                                  or match.get("finished") is True
                                  or status in {"finished", "ft", "ended", "complete", "completed"}
                              )
                              if not finished:
                                  continue

                              record = {
                                  "match": match,
                                  "league_name": league_name,
                                  "league_id": league_id,
                                  "season": season,
                                  "collected_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                              }
                              for label, method in (
                                  ("stats", stats_method),
                                  ("shots", shots_method),
                                  ("advanced", advanced_method),
                              ):
                                  try:
                                      record[label] = as_dict(invoke(method, match_id=key))
                                  except Exception as exc:
                                      record[label] = None
                                      errors.append(f"{league_name} {season} match {key} {label}: {exc}")

                              store["matches"][key] = record
                              collected += 1
                              save_now()
                              print(f"  Saved match {key} ({collected}/{MAX_NEW_MATCHES}); total={len(store['matches'])}", flush=True)
                              time.sleep(0.15)
                      except Exception as exc:
                          msg = f"{league_name} {season}: {type(exc).__name__}: {exc}"
                          errors.append(msg)
                          print("WARNING:", msg, flush=True)
                  if stop:
                      break

          store["metadata"].update({
              "last_run_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "discovered_matches_this_run": discovered,
              "new_matches_stored_this_run": collected,
              "total_stored_matches": len(store["matches"]),
              "errors_this_run": errors[:100],
          })
          save_now()
          print(f"Discovered matches this run: {discovered}", flush=True)
          print(f"New matches stored this run: {collected}", flush=True)
          print(f"Total stored match records: {len(store['matches'])}", flush=True)
          print(f"Errors: {len(errors)}", flush=True)
          for error in errors[:30]:
              print("WARNING:", error, flush=True)
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pitchapi_stats.json
          if git diff --cached --quiet; then
            echo "No new statistics to commit."
          else
            git commit -m "Update multi-league PitchAPI statistics"
            git push
          fi
