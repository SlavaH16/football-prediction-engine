

name: Test PitchAPI football data

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  test-pitchapi:
    runs-on: ubuntu-latest
    steps:
      - name: Test PitchAPI
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          base = "https://api.pitchapi.dev/v1"
          session = requests.Session()
          session.headers.update({
              "X-API-KEY": os.environ["PITCHAPI_API_KEY"].strip(),
              "Accept": "application/json"
          })

          def get(path):
              r = session.get(base + path, timeout=30)
              print(f"\nGET {path} -> HTTP {r.status_code}")
              print(r.text[:2500])
              r.raise_for_status()
              return r.json()

          print("TEST 1: Premier League matches")
          try:
              data = get("/leagues/l_4WFCIZ/matches")
              print("\nMatches endpoint responded successfully.")
          except Exception as e:
              print("Matches request failed:", str(e))

          print("\nTEST 2: API documentation endpoint")
          try:
              data = get("/openapi.json")
              print("\nDocumentation endpoint responded.")
          except Exception as e:
              print("OpenAPI endpoint not available at this path:", str(e))

          print("\nTEST FINISHED")
          PY
