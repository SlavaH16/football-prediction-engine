
name: Audit model training data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data audit
        run: python scripts/audit_model_data.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: model-data-audit
          path: model-data-audit/
          if-no-files-found: error
          retention-days: 30

