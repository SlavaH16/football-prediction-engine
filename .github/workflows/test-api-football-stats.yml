
name: Test API-Football match statistics

'on': [workflow_dispatch]

permissions:
  contents: read

jobs:
  test-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check recent match statistics and xG
        env:
          FOOTBALL_API: ${{ secrets.FOOTBALL_API }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          key = os.environ.get("FOOTBALL_API", "").strip()
          if not key:
              raise SystemExit("Secret FOOTBALL_API is missing.")

          base = "https://v3.football.api-sports.io"
          headers = {"x-apisports-key": key}

          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              errors = data.get("errors") or {}
              if errors:
                  raise SystemExit(f"API error: {errors}")
              return data.get("response") or []

          today = datetime.now(ZoneInfo("Europe/Prague")).date()
          fixtures = []

          for offset in (1, 2):
              day = (today - timedelta(days=offset)).isoformat()
              fixtures = get("/fixtures?" + urllib.parse.urlencode({
                  "date": day,
                  "status": "FT"
              }))
              if fixtures:
                  print("Finished matches found:", len(fixtures))
                  break

          if not fixtures:
              raise SystemExit("No recent finished matches found.")

          match = fixtures[0]
          fixture_id = match["fixture"]["id"]
          teams = match.get("teams") or {}
          league = match.get("league") or {}

          print("Competition:", league.get("name"))
          print("Home:", (teams.get("home") or {}).get("name"))
          print("Away:", (teams.get("away") or {}).get("name"))
          print("Fixture ID:", fixture_id)

          stats = get("/fixtures/statistics?" + urllib.parse.urlencode({
              "fixture": fixture_id
          }))

          if not stats:
              print("No statistics available for this match.")
          else:
              found = set()
              for item in stats:
                  print("Team:", (item.get("team") or {}).get("name"))
                  for stat in item.get("statistics") or []:
                      name = stat.get("type", "")
                      value = stat.get("value")
                      print(f"  {name}: {value}")
                      found.add(name.lower())

              print("--- Coverage summary ---")
              checks = {
                  "xG": ("expected_goals", "expected goals", "xg"),
                  "Shots": ("total shots", "shots on goal"),
                  "Possession": ("ball possession",),
                  "Corners": ("corner kicks",)
              }
              for label, terms in checks.items():
                  available = any(
                      term in name
                      for name in found
                      for term in terms
                  )
                  print(f"{label}: {'YES' if available else 'NOT FOUND'}")
          PY

