name: Aktualizace historie fotbalu

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stáhnout historické výsledky
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, datetime, urllib.request, urllib.error
          from pathlib import Path

          token = os.environ.get("FOOTBALL_DATA_TOKEN")
          if not token:
              raise SystemExit("Chybí GitHub Secret FOOTBALL_DATA_TOKEN")

          today = datetime.date.today()
          start = today - datetime.timedelta(days=365)
          url = (
              "https://api.football-data.org/v4/matches"
              f"?dateFrom={start.isoformat()}&dateTo={today.isoformat()}"
          )
          req = urllib.request.Request(url, headers={"X-Auth-Token": token})
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              print(f"API vrátilo HTTP {exc.code}: {body[:1000]}")
              raise SystemExit(
                  "Historické období může být omezené tarifem. "
                  "Podrobnosti jsou v logu GitHub Actions."
              )

          finished = [
              m for m in payload.get("matches", [])
              if m.get("status") == "FINISHED"
          ]
          Path("data").mkdir(exist_ok=True)
          out = {
              "updated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "dateFrom": start.isoformat(),
              "dateTo": today.isoformat(),
              "count": len(finished),
              "source": "football-data.org",
              "matches": finished
          }
          Path("data/history.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Uloženo dokončených historických zápasů: {len(finished)}")
          PY

      - name: Uložit historii do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Aktualizace historie zápasů"
          git push
