
name: Validate prediction model

on:
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * 1"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run chronological backtest
        run: python scripts/backtest_model.py

      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "Update historical model validation"
            git push
          fi

