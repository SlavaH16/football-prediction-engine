name: Discover PitchAPI leagues

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Install PitchAPI
        run: python -m pip install --upgrade pip pitchapi

      - name: Discover leagues and seasons
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pitchapi import PitchAPI

          api_key = os.environ.get("PITCHAPI_API_KEY")
          if not api_key:
              raise SystemExit("Missing GitHub secret PITCHAPI_API_KEY")

          with PitchAPI(api_key=api_key) as client:
              result = client.leagues.list()

          if hasattr(result, "model_dump"):
              result = result.model_dump()
          elif hasattr(result, "__dict__"):
              result = vars(result)

          print("=== PITCHAPI LEAGUES ===")
          print(json.dumps(result, ensure_ascii=False, default=str, indent=2))
          PY
