


<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Prediction Engine</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b1220;color:#f1f5f9;font:16px Arial;padding:16px;max-width:850px;margin:auto}
h1{color:#75e0b2;font-size:27px}
p,.muted,small{color:#aab8cc}
.card{background:#172438;border:1px solid #30415a;border-radius:14px;padding:14px;margin:12px 0}
button,select,input{padding:11px;border-radius:9px;border:1px solid #40516a;margin:5px 3px;background:#26384d;color:#f1f5f9;max-width:100%}
button{background:#75e0b2;color:#092015;font-weight:bold;border:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;background:#26384d;border-radius:99px;padding:5px 8px;color:#b8c8dc}
#status{padding:12px;border-radius:10px;background:#172438}
.active{outline:2px solid #75e0b2}
.score{font-size:23px;color:#75e0b2;font-weight:bold}
</style>
</head>
<body>
<h1>⚽ Football Prediction Engine</h1>
<p>Fotbalové zápasy a historické výsledky</p>

<div id="status">Načítám data…</div>

<div class="card">
  <div class="row">
    <button id="upcomingBtn" class="active">Nadcházející zápasy</button>
    <button id="historyBtn">Historie výsledků</button>
  </div>
  <div class="row">
    <select id="league">
      <option value="">Všechny soutěže</option>
    </select>
    <input id="search" placeholder="Hledat tým…">
  </div>
  <p id="count" class="muted"></p>
</div>

<div id="matches"></div>

<div class="card">
  <h2>🎯 Vybrané zápasy</h2>
  <p id="selectedCount">Vybrané zápasy: 0</p>
  <div id="selectedList">Zatím nemáš vybrané žádné zápasy.</div>
  <button id="clear">Zrušit výběr</button>
  <p class="muted">Historické výsledky slouží jako podklad pro budoucí analýzu. Predikce zatím nejsou vypočítávány.</p>
</div>

<script>
let upcoming = [];
let history = [];
let mode = "upcoming";
const selected = new Map();

const statusEl = document.getElementById("status");
const matchesEl = document.getElementById("matches");
const leagueEl = document.getElementById("league");
const searchEl = document.getElementById("search");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function formatDate(value) {
  if (!value) return "Termín neznámý";
  return new Date(value).toLocaleString("cs-CZ", {
    dateStyle:"medium", timeStyle:"short"
  });
}

function currentMatches() {
  return mode === "history" ? history : upcoming;
}

function matchKey(m) {
  return mode + ":" + String(m.id);
}

function renderLeagues() {
  const matches = currentMatches();
  const previous = leagueEl.value;
  const leagues = [...new Set(
    matches.map(m => m.competition?.name).filter(Boolean)
  )].sort((a,b) => a.localeCompare(b, "cs"));

  leagueEl.innerHTML =
    '<option value="">Všechny soutěže</option>' +
    leagues.map(name => '<option value="' + esc(name) + '">' +
      esc(name) + '</option>').join("");

  if (leagues.includes(previous)) leagueEl.value = previous;
}

function render() {
  const matches = currentMatches();
  const league = leagueEl.value;
  const query = searchEl.value.trim().toLocaleLowerCase("cs-CZ");

  const list = matches.filter(m => {
    const teams = (m.homeTeam?.name || "") + " " + (m.awayTeam?.name || "");
    return (!league || m.competition?.name === league) &&
      (!query || teams.toLocaleLowerCase("cs-CZ").includes(query));
  });

  document.getElementById("count").textContent =
    "Zobrazeno " + list.length + " z " + matches.length + " zápasů.";

  if (!list.length) {
    matchesEl.innerHTML = '<div class="card">Žádné zápasy neodpovídají filtru.</div>';
  } else {
    matchesEl.innerHTML = list.map(m => {
      const id = matchKey(m);
      const finished = m.status === "FINISHED";
      const state = finished ? "Odehráno" :
        m.status === "IN_PLAY" ? "Právě se hraje" :
        m.status === "POSTPONED" ? "Odloženo" :
        m.status === "CANCELLED" ? "Zrušeno" : "Naplánováno";

      const home = m.score?.fullTime?.home;
      const away = m.score?.fullTime?.away;
      const hasScore = home != null && away != null;

      const score = hasScore
        ? '<p class="score">' + home + ' : ' + away + '</p>'
        : "";

      const chosen = selected.has(id);

      return '<div class="card">' +
        '<div class="row"><span class="badge">' +
        esc(m.competition?.name || "Soutěž") +
        '</span><span class="badge">' + state + '</span></div>' +
        '<h3>' + esc(m.homeTeam?.name || "Domácí") + ' – ' +
        esc(m.awayTeam?.name || "Hosté") + '</h3>' +
        (mode === "history" ? score : "") +
        '<p>' + esc(formatDate(m.utcDate)) + '</p>' +
        (mode === "upcoming" && hasScore ? score : "") +
        '<button data-id="' + esc(id) + '" class="' +
        (chosen ? "active" : "") + '">' +
        (chosen ? "✓ Vybráno" : "＋ Vybrat zápas") +
        '</button></div>';
    }).join("");
  }

  document.getElementById("selectedCount").textContent =
    "Vybrané zápasy: " + selected.size;

  const chosen = [...selected.values()];
  document.getElementById("selectedList").innerHTML = chosen.length
    ? chosen.map(m => '<p>' +
        esc(m.homeTeam?.name) + ' – ' + esc(m.awayTeam?.name) +
        (m.score?.fullTime?.home != null && m.score?.fullTime?.away != null
          ? ' (' + m.score.fullTime.home + ' : ' + m.score.fullTime.away + ')'
          : '') +
        '<br><small>' + esc(m.competition?.name || "") + '</small></p>'
      ).join("")
    : "Zatím nemáš vybrané žádné zápasy.";

  document.getElementById("upcomingBtn").classList.toggle("active", mode === "upcoming");
  document.getElementById("historyBtn").classList.toggle("active", mode === "history");
}

matchesEl.addEventListener("click", event => {
  const button = event.target.closest("button[data-id]");
  if (!button) return;

  const id = button.dataset.id;
  const m = currentMatches().find(item => matchKey(item) === id);
  if (!m) return;

  if (selected.has(id)) selected.delete(id);
  else selected.set(id, m);

  render();
});

document.getElementById("upcomingBtn").addEventListener("click", () => {
  mode = "upcoming";
  renderLeagues();
  render();
});

document.getElementById("historyBtn").addEventListener("click", () => {
  mode = "history";
  renderLeagues();
  render();
});

leagueEl.addEventListener("change", render);
searchEl.addEventListener("input", render);

document.getElementById("clear").addEventListener("click", () => {
  selected.clear();
  render();
});

async function fetchJson(path) {
  const response = await fetch(path + "?ts=" + Date.now(), {
    cache:"no-store"
  });
  if (!response.ok) throw new Error(path + ": HTTP " + response.status);
  return response.json();
}

async function loadMatches() {
  const results = await Promise.allSettled([
    fetchJson("data/matches.json"),
    fetchJson("data/history.json")
  ]);

  if (results[0].status === "fulfilled") {
    const data = results[0].value;
    upcoming = Array.isArray(data.matches) ? data.matches : [];
  }

  if (results[1].status === "fulfilled") {
    const data = results[1].value;
    history = Array.isArray(data.matches) ? data.matches : [];
  }

  const errors = [];
  if (results[0].status === "rejected") errors.push("nadcházející zápasy");
  if (results[1].status === "rejected") errors.push("historie");

  if (!upcoming.length && !history.length) {
    statusEl.textContent = "Nepodařilo se načíst žádná data. " + errors.join(", ");
    return;
  }

  statusEl.textContent =
    "Načteno: " + upcoming.length + " aktuálních a nadcházejících zápasů; " +
    history.length + " historických výsledků." +
    (errors.length ? " Nepodařilo se načíst: " + errors.join(", ") + "." : "");

  renderLeagues();
  render();
}

loadMatches();
</script>
</body>
</html>
